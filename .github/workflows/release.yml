name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build a static Linux binary and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --release

      - name: Package
        run: |
          set -eu
          NAME="wikibits-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/data"
          cp target/x86_64-unknown-linux-musl/release/wikibits "dist/$NAME/wikibits"
          cp bin/install "dist/$NAME/bin/install"
          cp data/wikibits.desktop data/wikibits.svg "dist/$NAME/data/"
          cp -r examples "dist/$NAME/examples"
          cp README.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "wikiBits $GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256
